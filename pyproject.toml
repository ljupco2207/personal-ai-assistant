[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ljupcho Gjorgjiev", email = "ljupcho@musicmakesusfeels.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
personal-ai-assistant = "personal_ai_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
